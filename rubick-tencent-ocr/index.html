<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>腾讯OCR</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f2329;
    --text-sub: #8a919f;
    --border: #e8eaf0;
    --primary: #006eff;
    --primary-soft: #e6f0ff;
    --danger: #ef4f4f;
    --ok: #2bb673;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #252533;
      --text: #e8eaf0;
      --text-sub: #9aa1ad;
      --border: #38384a;
      --primary-soft: #1c2a44;
      --danger: #ff7875;
      --ok: #49cc90;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }
  .head-menu {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    flex-wrap: wrap;
  }
  .type-select {
    border: 1px solid var(--border);
    background: var(--primary-soft);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
    max-width: 200px;
  }
  .type-select:focus { border-color: var(--primary); }
  .flex { flex: 1; }
  .tool {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: filter .15s;
    white-space: nowrap;
  }
  .tool:hover { filter: brightness(.95); background: var(--primary-soft); border-color: var(--primary); }
  .tool.primary { background: linear-gradient(135deg, #2f7bff, #006eff); color: #fff; border: none; font-weight: 600; }
  .tool.accent { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); font-weight: 600; }
  .tool[hidden] { display: none; }
  .main-content {
    flex: 1;
    display: flex;
    gap: 12px;
    padding: 0 14px;
    min-height: 0;
  }
  .img-box {
    width: 44%;
    max-width: 300px;
    flex: none;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background: var(--primary-soft);
    min-height: 0;
  }
  .img-box.has-img { border-style: solid; }
  .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .placeholder { text-align: center; color: var(--text-sub); padding: 20px; }
  .placeholder .big { font-size: 44px; margin-bottom: 10px; opacity: .8; }
  .placeholder div { line-height: 1.7; font-size: 12px; }
  .clear-img {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,.45);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 4px 9px;
    font-size: 11px;
    cursor: pointer;
  }
  .right-box { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .result-toolbar {
    display: flex;
    gap: 6px;
    padding: 0 0 8px;
    flex-wrap: wrap;
  }
  .result-toolbar[hidden] { display: none; }
  .result-toolbar .tool { padding: 3px 8px; font-size: 11px; }
  .result-area { flex: 1; min-height: 0; position: relative; }
  .result-area > * { position: absolute; inset: 0; }
  .result-area > * [hidden] { display: none; }
  .result-area textarea {
    width: 100%;
    height: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text);
    padding: 12px;
    font-size: 13px;
    line-height: 1.6;
    resize: none;
    outline: none;
    font-family: inherit;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .result-area textarea:focus { border-color: var(--primary); }
  .table-preview {
    width: 100%;
    height: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    overflow: auto;
    background: transparent;
  }
  .table-preview table { width: 100%; border-collapse: collapse; }
  .table-preview td {
    border: 1px solid var(--border);
    padding: 4px 8px;
    font-size: 12px;
    line-height: 1.5;
    word-break: break-word;
  }
  .fields-list {
    width: 100%;
    height: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    overflow-y: auto;
    background: transparent;
  }
  .field-item {
    display: flex;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    line-height: 1.5;
  }
  .field-item:last-child { border-bottom: none; }
  .field-item .fk {
    color: var(--text-sub);
    flex: 0 0 auto;
    max-width: 45%;
    word-break: break-word;
  }
  .field-item .fv {
    color: var(--text);
    flex: 1;
    word-break: break-word;
  }
  .status {
    padding: 6px 14px 10px;
    font-size: 12px;
    color: var(--text-sub);
    min-height: 18px;
  }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--ok); }
  /* modals */
  .mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .mask[hidden] { display: none; }
  .modal {
    width: 420px;
    max-width: 92vw;
    max-height: 86vh;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.2);
  }
  .modal h3 { font-size: 15px; margin-bottom: 14px; }
  .modal label.field { display: block; font-size: 12px; color: var(--text-sub); margin: 10px 0 4px; }
  .modal input[type=text], .modal input[type=password] {
    width: 100%;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    padding: 0 10px;
    font-size: 13px;
    outline: none;
  }
  .modal input:focus { border-color: var(--primary); }
  .modal .check-row { margin-top: 10px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .modal-actions { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  /* toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    background: rgba(0,0,0,.82);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 50;
    max-width: 90%;
    word-break: break-all;
  }
  /* history */
  .hist-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .hist-item:hover { border-color: var(--primary); }
  .hist-item .h-result { font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 80px; overflow: hidden; }
  .hist-item .h-time { font-size: 10px; color: var(--text-sub); margin-top: 4px; }
  .hist-item .h-type { font-size: 10px; color: var(--primary); margin-bottom: 4px; font-weight: 600; }
</style>
</head>
<body>
  <div class="app">
    <div class="head-menu">
      <select id="typeSelect" class="type-select"></select>
      <span class="flex"></span>
      <button class="tool" id="captureBtn" hidden>截图</button>
      <button class="tool" id="copyBtn" hidden>复制</button>
      <button class="tool accent" id="copyExcelBtn" hidden>复制为 Excel</button>
      <button class="tool" id="copyMdBtn" hidden>复制为 MD</button>
      <button class="tool" id="copyCsvBtn" hidden>复制为 CSV</button>
      <button class="tool" id="copyJsonBtn" hidden>复制为 JSON</button>
      <button class="tool" id="mergeBtn" hidden>合并行</button>
      <button class="tool" id="histBtn" hidden>历史</button>
      <button class="tool" id="settingBtn">设置</button>
    </div>

    <div class="main-content">
      <div class="img-box" id="imgBox">
        <div class="placeholder" id="placeholder">
          <div class="big">🖼️</div>
          <div>拖拽图片到这里<br/>粘贴 (Ctrl+V) · 点击选择 · 截图识别</div>
        </div>
        <img id="img" alt="" hidden />
        <button class="clear-img" id="clearImg" hidden>✕ 清除</button>
      </div>
      <div class="right-box">
        <div class="result-area">
          <textarea id="result" placeholder="识别结果将显示在这里…"></textarea>
          <div id="resultTable" class="table-preview" hidden></div>
          <div id="resultFields" class="fields-list" hidden></div>
        </div>
      </div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <!-- 设置 -->
  <div class="mask" id="settingsMask" hidden>
    <div class="modal">
      <h3>设置 · 腾讯云OCR</h3>
      <label class="field">SecretId（控制台 → 访问管理 → API密钥管理）</label>
      <input id="cfgId" type="text" placeholder="AKIDxxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
      <label class="field">SecretKey</label>
      <input id="cfgKey" type="password" placeholder="请输入 SecretKey" />
      <label class="field">Region（接口地域）</label>
      <input id="cfgRegion" type="text" list="regionList" autocomplete="off" />
      <datalist id="regionList">
        <option value="ap-guangzhou">广州</option>
        <option value="ap-beijing">北京</option>
        <option value="ap-shanghai">上海</option>
        <option value="ap-shenzhen-fsi">深圳(金融)</option>
        <option value="ap-nanjing">南京</option>
        <option value="ap-chengdu">成都</option>
        <option value="ap-chongqing">重庆</option>
        <option value="ap-tokyo">东京</option>
        <option value="na-siliconvalley">硅谷</option>
        <option value="na-ashburn">弗吉尼亚</option>
        <option value="eu-frankfurt">法兰克福</option>
      </datalist>
      <label class="field">默认识别类型</label>
      <select id="cfgType" class="type-select" style="width:100%;padding:6px 10px"></select>
      <label class="check-row"><input type="checkbox" id="cfgHistory" /> 保存识别历史</label>
      <div class="modal-actions">
        <button class="tool" id="testBtn">测试连接</button>
        <span class="flex"></span>
        <button class="tool" id="cancelSetting">取消</button>
        <button class="tool primary" id="saveSetting">保存</button>
      </div>
    </div>
  </div>

  <!-- 历史 -->
  <div class="mask" id="historyMask" hidden>
    <div class="modal">
      <h3>识别历史</h3>
      <div id="histList" style="max-height:60vh;overflow-y:auto"></div>
      <div class="modal-actions">
        <span class="flex"></span>
        <button class="tool" id="clearHist">清空历史</button>
        <button class="tool" id="closeHist">关闭</button>
      </div>
    </div>
  </div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var CFG_KEY = 'rubick-tencent-ocr-config';
  var HIST_KEY = 'rubick-tencent-ocr-history';

  function hasRubick() {
    return typeof window.rubick !== 'undefined' && window.rubick;
  }
  function db() {
    if (hasRubick() && window.rubick.dbStorage) return window.rubick.dbStorage;
    return null;
  }
  function dbGet(k, fallback) {
    try {
      if (db()) {
        var v = db().getItem(k);
        if (v != null) return v;
      }
      var raw = localStorage.getItem(k);
      if (raw != null) return JSON.parse(raw);
    } catch (e) {}
    return fallback;
  }
  function dbSet(k, v) {
    try {
      if (db()) {
        db().setItem(k, v);
        localStorage.setItem(k, JSON.stringify(v));
        return;
      }
      localStorage.setItem(k, JSON.stringify(v));
    } catch (e) {}
  }

  var defaults = {
    secretId: '',
    secretKey: '',
    region: 'ap-guangzhou',
    type: 'print',
    history: true,
    historyLength: 10,
  };
  if (window.TC_OCR_CONFIG) {
    defaults.secretId = window.TC_OCR_CONFIG.secretId || '';
    defaults.secretKey = window.TC_OCR_CONFIG.secretKey || '';
    defaults.region = window.TC_OCR_CONFIG.region || 'ap-guangzhou';
    if (window.TC_OCR_CONFIG.type && window.tcOcr && window.tcOcr.TYPES[window.TC_OCR_CONFIG.type]) {
      defaults.type = window.TC_OCR_CONFIG.type;
    }
  }

  var config = Object.assign({}, defaults, dbGet(CFG_KEY, {}));
  var historys = Array.isArray(dbGet(HIST_KEY, [])) ? dbGet(HIST_KEY, []) : [];
  var currentSrc = '';
  var currentResp = null; // 最近一次识别的原始响应

  /* ---------- utils ---------- */
  var toastTimer = null;
  function toast(msg, isError) {
    var el = document.querySelector('.toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.background = isError ? 'rgba(190,40,40,.92)' : 'rgba(0,0,0,.82)';
    el.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.style.display = 'none'; }, 2600);
  }
  function setStatus(msg, cls) {
    var el = document.getElementById('status');
    el.textContent = msg || '';
    el.className = 'status' + (cls ? ' ' + cls : '');
  }
  function setImg(dataUrl) {
    currentSrc = dataUrl;
    var img = document.getElementById('img');
    var box = document.getElementById('imgBox');
    img.src = dataUrl;
    img.hidden = false;
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('clearImg').hidden = false;
    box.classList.add('has-img');
  }
  function clearImg() {
    currentSrc = '';
    currentResp = null;
    document.getElementById('img').hidden = true;
    document.getElementById('placeholder').style.display = '';
    document.getElementById('clearImg').hidden = true;
    document.getElementById('imgBox').classList.remove('has-img');
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function typeCfg() {
    return (window.tcOcr && window.tcOcr.TYPES[config.type]) || { label: '高精度文字识别', kind: 'text', category: '文字' };
  }

  /* ---------- result display ---------- */
  function showResultByType(resp) {
    var cfg = typeCfg();
    currentResp = resp;
    var textarea = document.getElementById('result');
    var tableEl = document.getElementById('resultTable');
    var fieldsEl = document.getElementById('resultFields');
    textarea.hidden = false;
    tableEl.hidden = true;
    fieldsEl.hidden = true;

    var txt = '';
    if (cfg.kind === 'text') {
      txt = window.tcOcr.textOf(resp);
      textarea.value = txt;
    } else if (cfg.kind === 'table') {
      var html = window.tcOcr.tableToHtml(resp);
      var csv = window.tcOcr.tableToCsv(resp);
      textarea.value = csv; // textarea 里放 CSV 方便直接看
      tableEl.innerHTML = html;
      tableEl.hidden = false;
      textarea.hidden = true;
    } else if (cfg.kind === 'structured') {
      var fields = window.tcOcr.fieldsOf(resp);
      txt = window.tcOcr.fieldsToText(fields);
      textarea.value = txt;
      fieldsEl.innerHTML = fields.map(function (f) {
        return '<div class="field-item"><div class="fk">' + escapeHtml(f.key) + '</div><div class="fv">' + escapeHtml(f.value) + '</div></div>';
      }).join('') || '<div style="color:var(--text-sub);text-align:center;padding:20px">无字段</div>';
      fieldsEl.hidden = false;
      textarea.hidden = true;
    }
    updateToolbarVisibility();
    return txt;
  }

  function updateToolbarVisibility() {
    var cfg = typeCfg();
    var hasResult = currentResp != null;
    document.getElementById('copyBtn').hidden = !hasResult;
    document.getElementById('mergeBtn').hidden = !hasResult || cfg.kind !== 'text';
    document.getElementById('copyExcelBtn').hidden = !hasResult || cfg.kind !== 'table';
    document.getElementById('copyMdBtn').hidden = !hasResult || cfg.kind !== 'table';
    document.getElementById('copyCsvBtn').hidden = !hasResult || cfg.kind !== 'table';
    document.getElementById('copyJsonBtn').hidden = !hasResult || (cfg.kind !== 'table' && cfg.kind !== 'structured');
  }

  function applyTypeTitle() {
    // 类型下拉框的选中项已由 select 本身显示，无需额外 title
    var sel = document.getElementById('typeSelect');
    if (sel && sel.value !== config.type) sel.value = config.type;
    var cfgSel = document.getElementById('cfgType');
    if (cfgSel && cfgSel.value !== config.type) cfgSel.value = config.type;
  }

  /* ---------- copy actions ---------- */
  function doCopy() {
    var cfg = typeCfg();
    var textarea = document.getElementById('result');
    var txt = textarea.value;
    if (cfg.kind === 'table') {
      var html = window.tcOcr.tableToHtml(currentResp);
      var csv = window.tcOcr.tableToCsv(currentResp);
      // 富文本剪贴板：Excel/Word 粘 HTML，其他粘纯文本
      if (window.tcOcr.copyRich(html, csv)) {
        toast('已复制表格（粘 Excel 自动识别）');
      } else {
        window.tcOcr.copyText(csv);
        toast('已复制（纯文本）');
      }
    } else if (cfg.kind === 'structured') {
      window.tcOcr.copyText(txt);
      toast('已复制');
    } else {
      if (typeof window.copyText === 'function') window.copyText(txt);
      else if (window.tcOcr.copyText) window.tcOcr.copyText(txt);
      else if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(function () {});
      toast('已复制');
    }
  }
  function doCopyExcel() {
    if (!currentResp) return;
    var html = window.tcOcr.tableToHtml(currentResp);
    var csv = window.tcOcr.tableToCsv(currentResp);
    if (window.tcOcr.copyRich(html, csv)) {
      toast('已复制为 Excel 格式，粘到 Excel/WPS 自动识别为表格');
    } else {
      window.tcOcr.copyText(csv);
      toast('已复制（纯文本 CSV，可直接粘 Excel）');
    }
  }
  function doCopyMd() {
    if (!currentResp) return;
    var md = window.tcOcr.tableToMarkdown(currentResp);
    window.tcOcr.copyText(md);
    toast('已复制为 Markdown 表格');
  }
  function doCopyCsv() {
    if (!currentResp) return;
    var csv = window.tcOcr.tableToCsv(currentResp);
    window.tcOcr.copyText(csv);
    toast('已复制为 CSV（含 BOM，Excel 直接打开）');
  }
  function doCopyJson() {
    if (!currentResp) return;
    var cfg = typeCfg();
    var json;
    if (cfg.kind === 'table') {
      json = window.tcOcr.tableToJson(currentResp);
    } else {
      var fields = window.tcOcr.fieldsOf(currentResp);
      json = window.tcOcr.fieldsToJson(fields);
    }
    window.tcOcr.copyText(json);
    toast('已复制为 JSON');
  }

  /* ---------- type selector ---------- */
  function buildTypeSelect(sel) {
    var types = window.tcOcr.TYPES;
    var categories = {};
    for (var key in types) {
      var t = types[key];
      if (!categories[t.category]) categories[t.category] = [];
      categories[t.category].push({ value: key, label: t.label });
    }
    var html = '';
    for (var cat in categories) {
      html += '<optgroup label="' + escapeHtml(cat) + '">';
      for (var i = 0; i < categories[cat].length; i++) {
        var item = categories[cat][i];
        html += '<option value="' + item.value + '">' + escapeHtml(item.label) + '</option>';
      }
      html += '</optgroup>';
    }
    sel.innerHTML = html;
  }

  /* ---------- recognize ---------- */
  function recognizeBase64(b64) {
    if (!window.tcOcr) { toast('插件环境异常：未加载 tcOcr', true); return; }
    var id = (config.secretId || '').trim();
    var key = (config.secretKey || '').trim();
    if (!id || !key) {
      toast('请先点右上角「设置」填写腾讯云 SecretId / SecretKey', true);
      return;
    }
    setStatus('识别中…');
    window.tcOcr.recognize({
      secretId: id,
      secretKey: key,
      region: (config.region || 'ap-guangzhou').trim(),
      imageBase64: b64,
      type: config.type,
    }).then(function (resp) {
      var txt = showResultByType(resp);
      var kind = typeCfg().kind;
      var hasContent = kind === 'text' ? !!txt : (kind === 'table' ? (resp.Cells && resp.Cells.length) : (window.tcOcr.fieldsOf(resp).length > 0));
      setStatus(hasContent ? '识别完成' : '识别完成（无内容）', 'ok');
      if (config.history && hasContent) pushHistory(currentSrc, JSON.stringify(resp));
    }).catch(function (e) {
      setStatus('');
      toast('识别失败：' + (e && e.message || e), true);
    });
  }
  function recognizeFromDataUrl(dataUrl) {
    var b64 = dataUrl;
    if (dataUrl.indexOf('base64,') >= 0) b64 = dataUrl.split('base64,')[1];
    else if (dataUrl.indexOf(',') >= 0) b64 = dataUrl.split(',')[1];
    recognizeBase64(b64);
  }
  function recognizeFromFilePath(filePath) {
    if (!window.tcOcr) return;
    setStatus('读取图片…');
    try {
      var b64 = window.tcOcr.readImageFile(filePath);
      setStatus('识别中…');
      window.tcOcr.recognize({
        secretId: (config.secretId || '').trim(),
        secretKey: (config.secretKey || '').trim(),
        region: (config.region || 'ap-guangzhou').trim(),
        imageBase64: b64,
        type: config.type,
      }).then(function (resp) {
        var txt = showResultByType(resp);
        var kind = typeCfg().kind;
        var hasContent = kind === 'text' ? !!txt : (kind === 'table' ? (resp.Cells && resp.Cells.length) : (window.tcOcr.fieldsOf(resp).length > 0));
        setStatus(hasContent ? '识别完成' : '识别完成（无内容）', 'ok');
        if (config.history && hasContent) pushHistory(filePath, JSON.stringify(resp));
      }).catch(function (e) {
        setStatus('');
        toast('识别失败：' + (e && e.message || e), true);
      });
    } catch (e) {
      setStatus('');
      toast('读取图片失败：' + e.message, true);
    }
  }

  /* ---------- history ---------- */
  function pushHistory(src, result) {
    var item = { src: src, result: result, type: config.type, time: new Date().toLocaleString() };
    historys = [item].concat(historys);
    if (historys.length > (config.historyLength || 10)) historys = historys.slice(0, config.historyLength);
    dbSet(HIST_KEY, historys);
    document.getElementById('histBtn').hidden = !historys.length;
  }
  function renderHistory() {
    var el = document.getElementById('histList');
    if (!historys.length) {
      el.innerHTML = '<div style="color:var(--text-sub);text-align:center;padding:20px">暂无历史</div>';
      return;
    }
    el.innerHTML = historys.map(function (h, i) {
      var tLabel = (window.tcOcr && window.tcOcr.TYPES[h.type] && window.tcOcr.TYPES[h.type].label) || h.type || '文字';
      return '<div class="hist-item" data-i="' + i + '">' +
        '<div class="h-type">' + escapeHtml(tLabel) + '</div>' +
        '<div class="h-result">' + escapeHtml(h.result) + '</div>' +
        '<div class="h-time">' + escapeHtml(h.time) + ' · 点击恢复</div></div>';
    }).join('');
  }

  /* ---------- image input ---------- */
  function readFileAsDataURL(file, cb) {
    var r = new FileReader();
    r.onload = function () { cb(r.result); };
    r.readAsDataURL(file);
  }

  /* ---------- rubick hooks ---------- */
  function bindRubickHooks() {
    if (!hasRubick()) return;
    if (window.rubick.onPluginEnter) {
      window.rubick.onPluginEnter(function (data) {
        data = data || {};
        var payload = data.payload;
        // 支持通过 feature code 覆盖识别类型（如 data.code = 'table' / 'invoice'）
        var codeToCheck = data.code || (data.ext && data.ext.code);
        if (codeToCheck && window.tcOcr.TYPES[codeToCheck]) {
          config.type = codeToCheck;
          applyTypeTitle();
        }
        // 支持通过 payload 覆盖识别类型（如 data.payload = { type: 'table' }）
        if (payload && typeof payload === 'object' && payload.type && window.tcOcr.TYPES[payload.type]) {
          config.type = payload.type;
          applyTypeTitle();
        }
        if (data.type === 'files' && Array.isArray(payload) && payload.length) {
          var f = payload[0];
          if (f && f.path) {
            setStatus('识别中…');
            try { setImg('file://' + f.path); } catch (e) {}
            recognizeFromFilePath(f.path);
          }
          return;
        }
        if (data.type === 'img' && typeof payload === 'string') {
          setImg(payload);
          recognizeFromDataUrl(payload);
          return;
        }
        document.getElementById('result').focus();
      });
    }
    if (window.rubick.onPluginReady) {
      window.rubick.onPluginReady(function () {
        try { window.rubick.setExpendHeight(580); } catch (e) {}
        repeatedlyRepaint();
      });
    }
    if (window.rubick.screenCapture) {
      document.getElementById('captureBtn').hidden = false;
    }
  }

  var __repaintTimer = null;
  function repeatedlyRepaint() {
    var attempts = 0;
    function kick() {
      attempts++;
      try {
        void document.body.offsetHeight;
        if (hasRubick()) window.rubick.setExpendHeight(580);
      } catch (e) {}
      if (document.visibilityState === 'hidden' && attempts < 30) {
        __repaintTimer = setTimeout(kick, 200);
      }
    }
    kick();
    setTimeout(kick, 300);
    setTimeout(kick, 900);
    setTimeout(function () { __repaintTimer = null; }, 3000);
  }

  /* ---------- settings ---------- */
  function openSettings() {
    document.getElementById('cfgId').value = config.secretId || '';
    document.getElementById('cfgKey').value = config.secretKey || '';
    document.getElementById('cfgRegion').value = config.region || 'ap-guangzhou';
    document.getElementById('cfgType').value = config.type || 'print';
    document.getElementById('cfgHistory').checked = !!config.history;
    document.getElementById('settingsMask').hidden = false;
  }
  function saveSettings() {
    config.secretId = document.getElementById('cfgId').value.trim();
    config.secretKey = document.getElementById('cfgKey').value.trim();
    config.region = document.getElementById('cfgRegion').value.trim() || 'ap-guangzhou';
    config.type = document.getElementById('cfgType').value || 'print';
    config.history = document.getElementById('cfgHistory').checked;
    dbSet(CFG_KEY, config);
    applyTypeTitle();
    document.getElementById('settingsMask').hidden = true;
    toast('设置已保存');
  }
  function testConnection() {
    var id = document.getElementById('cfgId').value.trim();
    var key = document.getElementById('cfgKey').value.trim();
    var region = document.getElementById('cfgRegion').value.trim() || 'ap-guangzhou';
    if (!id || !key) { toast('请先填写 SecretId / SecretKey', true); return; }
    setStatus('正在测试连接…');
    window.tcOcr.recognize({
      secretId: id, secretKey: key, region: region,
      imageBase64: '', type: 'print',
    }).then(function () {
      toast('连接成功');
    }).catch(function (e) {
      var msg = (e && e.message) || String(e);
      if (/^Auth/i.test(msg)) {
        toast('密钥或签名有误：' + msg, true);
      } else {
        toast('连接正常（密钥有效），接口返回：' + msg);
      }
    });
  }

  /* ---------- events ---------- */
  function bindEvents() {
    var imgBox = document.getElementById('imgBox');
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.style.display = 'none';
    document.body.appendChild(fileInput);
    fileInput.addEventListener('change', function () {
      if (this.files && this.files[0]) {
        var f = this.files[0];
        readFileAsDataURL(f, function (dataUrl) {
          setImg(dataUrl);
          recognizeFromDataUrl(dataUrl);
        });
      }
      this.value = '';
    });
    imgBox.addEventListener('click', function () { fileInput.click(); });
    imgBox.addEventListener('dragover', function (e) { e.preventDefault(); });
    imgBox.addEventListener('drop', function (e) {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
        var f = e.dataTransfer.files[0];
        readFileAsDataURL(f, function (dataUrl) {
          setImg(dataUrl);
          recognizeFromDataUrl(dataUrl);
        });
      }
    });
    document.addEventListener('paste', function (e) {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf('image') === 0) {
          var file = items[i].getAsFile();
          if (file) {
            e.preventDefault();
            readFileAsDataURL(file, function (dataUrl) {
              setImg(dataUrl);
              recognizeFromDataUrl(dataUrl);
            });
          }
          break;
        }
      }
    });

    document.getElementById('clearImg').addEventListener('click', function (e) {
      e.stopPropagation();
      clearImg();
      currentResp = null;
      document.getElementById('result').value = '';
      document.getElementById('resultTable').innerHTML = '';
      document.getElementById('resultFields').innerHTML = '';
      updateToolbarVisibility();
      setStatus('');
    });
    document.getElementById('captureBtn').addEventListener('click', function () {
      if (window.rubick && window.rubick.screenCapture) {
        window.rubick.screenCapture(function (dataUrl) {
          setImg(dataUrl);
          recognizeFromDataUrl(dataUrl);
        });
      }
    });
    document.getElementById('typeSelect').addEventListener('change', function () {
      config.type = this.value;
      dbSet(CFG_KEY, config);
      updateToolbarVisibility();
    });
    document.getElementById('copyBtn').addEventListener('click', doCopy);
    document.getElementById('copyExcelBtn').addEventListener('click', doCopyExcel);
    document.getElementById('copyMdBtn').addEventListener('click', doCopyMd);
    document.getElementById('copyCsvBtn').addEventListener('click', doCopyCsv);
    document.getElementById('copyJsonBtn').addEventListener('click', doCopyJson);
    document.getElementById('mergeBtn').addEventListener('click', function () {
      var area = document.getElementById('result');
      area.value = area.value.replace(/\n+/g, '');
      setStatus('已合并为一行', 'ok');
    });
    document.getElementById('settingBtn').addEventListener('click', openSettings);
    document.getElementById('saveSetting').addEventListener('click', saveSettings);
    document.getElementById('cancelSetting').addEventListener('click', function () {
      document.getElementById('settingsMask').hidden = true;
    });
    document.getElementById('testBtn').addEventListener('click', testConnection);
    document.getElementById('histBtn').addEventListener('click', function () {
      renderHistory();
      document.getElementById('historyMask').hidden = false;
    });
    document.getElementById('closeHist').addEventListener('click', function () {
      document.getElementById('historyMask').hidden = true;
    });
    document.getElementById('clearHist').addEventListener('click', function () {
      historys = [];
      dbSet(HIST_KEY, historys);
      renderHistory();
      document.getElementById('histBtn').hidden = true;
    });
    document.getElementById('histList').addEventListener('click', function (e) {
      var item = e.target.closest('.hist-item');
      if (!item) return;
      var h = historys[parseInt(item.getAttribute('data-i'), 10)];
      if (!h) return;
      if (h.type && window.tcOcr.TYPES[h.type]) {
        config.type = h.type;
        applyTypeTitle();
      }
      if (h.src && /^data:/.test(h.src)) setImg(h.src);
      // 从历史恢复：根据类型重新解析
      try {
        var resp = JSON.parse(h.result);
        showResultByType(resp);
      } catch (err) {
        // 历史存的是纯文本，直接显示
        document.getElementById('result').value = h.result;
        document.getElementById('resultTable').hidden = true;
        document.getElementById('resultFields').hidden = true;
        document.getElementById('result').hidden = false;
      }
      document.getElementById('historyMask').hidden = true;
    });
  }

  function init() {
    buildTypeSelect(document.getElementById('typeSelect'));
    buildTypeSelect(document.getElementById('cfgType'));
    applyTypeTitle();
    document.getElementById('histBtn').hidden = !historys.length;
    updateToolbarVisibility();
    bindEvents();
    bindRubickHooks();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
